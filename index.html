<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDGr</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">    
</head>
<body>
    <header>
        <img src="assets/logo.svg" alt="LEDGr-Expense Tracker" id="logo">
        <nav id="navbar">
            <a href="index.html" class="nav-link">home</a>
            <a href="history.html" class="nav-link">history</a>
            <a href="people.html" class="nav-link">people</a>
        </nav>    
    </header>
    <div id="inputbox">
        <button id="add-button" aria-label="Add Transaction">
            <svg viewBox="0 0 24 24" width="50" height="50" stroke-width="3.5" fill="none" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <div class="tagline">CLICK TO ADD A NEW TRANSACTION</div>
    </div>
    <div id="container">
        <div class="box" style="grid-area: box1;"></div>
        <div class="box" style="grid-area: box2;"></div>
        <div class="box" style="grid-area: box3;"></div>
        <div class="box" style="grid-area: box4;"></div>
        <div class="box" style="grid-area: box5;"></div>
        <div class="box" style="grid-area: box6;"></div>
        <div class="box" style="grid-area: box7;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
