<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDGr-Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" id="home-link" aria-label="Ledgr home">
            <div id="logo1" class="logo">LED</div>
            <div id="logo2" class="logo">Gr</div>
        </a>
        <button id="nav-btn" aria-label="Open Menu" aria-expanded="false" aria-controls="navbar">
            <img id="burger-img" src="assets/burger-menu.svg" alt="">
        </button>
        <nav id="navbar">
            <ul>
                <li><a href="index.html" class="nav-link">home</a></li>
                <li><a href="history.html" class="nav-link">history</a></li>
                <li><a href="people.html" class="nav-link">people</a></li>
            </ul>
        </nav>
    </header>
    <div id="overlay" aria-hidden="true"></div>
    <main>
        <div id="input-area">
            <div id="tagline">Got a New Transaction?</div>
            <div id="inputbox">
                <button id="add-button" aria-label="Add new transaction button" aria-expanded="false" aria-controls="main-form">
                    <svg viewBox="0 0 24 24" width="50" height="50" stroke-width="3.5" fill="none" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <form action="" id="main-form">
                    <input type="number" name="amount" id="amount" class="inputs" step="0.01" min="0.01" placeholder="Rs. " required aria-label="Amount Input">
                    <input type="text" id="category" name="category" list="category-list" placeholder="Search categories..." class="inputs" required aria-label="Category Input">
                    <datalist id="category-list">
                        <option value="Food">
                        <option value="Stationary">
                        <option value="Upkeep">
                        <option value="Travel">
                        <option value="Entertainment">
                        <option value="Health">
                    </datalist>
                    <input type="date" name="date" id="date" class="inputs" required aria-label="Date Input">
                    <button type="submit" class="inputs" id="log-btn">Add</button>
                </form>
            </div>
        </div>
        <div id="container">
            <div class="box" id="box1"></div>
            <div class="box" id="box2"></div>
            <div class="box" id="box3"></div>
            <div class="box" id="box4"></div>
            <div class="box" id="box5"></div>
            <div class="box" id="box6"></div>
            <div class="box" id="box7"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
